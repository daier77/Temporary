mixed-port: 7892
tproxy-port: 7894
ipv6: true # [融合 我的可莉]
allow-lan: false
unified-delay: true
tcp-concurrent: true
log-level: silent
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600
authentication: 
  - "nikki:520177" # [融合 我的可莉]
skip-auth-prefixes: [127.0.0.1/8, '::1/128']
