# >>> 规则路由 (从上往下顺序匹配，一旦命中立即执行对应动作) <<<
rules:  
  # 本地/私有 本地局域网与私有 IP 流量直接放行 (DIRECT)，不走代理
  - RULE-SET,Private,DIRECT
  - RULE-SET,PrivateIP,DIRECT,no-resolve
  
  # 网络测试 
  - RULE-SET,Speedtest,网络测试

  # 自定义应用规则补全
  - RULE-SET,TikTok,TikTok
  - RULE-SET,YouTube,YouTube
  
  # 即时通讯
  - RULE-SET,TM,即时通讯
  - RULE-SET,Telegram,即时通讯
  - RULE-SET,TelegramIP,即时通讯,no-resolve

  # 社交平台
  - RULE-SET,SocialMedia,社交平台
  - RULE-SET,SocialMediaIP,社交平台,no-resolve

  # 人工智能
  - RULE-SET,AI,人工智能
  - RULE-SET,AIIP,人工智能,no-resolve

  # 开发服务
  - RULE-SET,Dev,开发服务

  # 国际媒体
  - RULE-SET,Emby,EMBY
  - RULE-SET,EmbyIP,EMBY,no-resolve
  - RULE-SET,Streaming,国际媒体
  - RULE-SET,StreamingIP,国际媒体,no-resolve

  # 平台服务
  - RULE-SET,Google,谷歌服务
  - RULE-SET,GoogleIP,谷歌服务,no-resolve
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,Facebook,脸书服务
  - RULE-SET,Apple,苹果服务
  
  # 手动输入域名
  - RULE-SET,ManualDirect,手动直连
  - RULE-SET,ManualProxy,手动代理
  
  # 国外流量 未被上方细致分类捕捉到的所有海外流量，交由国外流量策略组处理
  - RULE-SET,Proxy,国外流量
  - RULE-SET,ProxyIP,国外流量,no-resolve

  # 国内流量 明确属于中国大陆的流量，直接交由国内流量策略组直连处理
  - RULE-SET,China,国内流量
  - RULE-SET,ChinaIP,国内流量,no-resolve

  # 兜底规则 以上所有规则都没有命中的流量，交由漏网之鱼策略组处理
  - MATCH,漏网之鱼

