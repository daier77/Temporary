# >>> 基础设置 <<<
mode: rule                  # 运行模式设置为规则模式，按下方设定好的路由规则进行分流
port: 7890                  # 纯 HTTP 代理监听端口
socks-port: 7891            # 纯 SOCKS5 代理监听端口
redir-port: 7892            # 透明代理重定向端口
mixed-port: 60012           # #daier 混合代理端口，同时支持 HTTP 和 SOCKS5
tproxy-port: 7895           # TProxy 透明代理端口
ipv6: true                  # #daier允许内核处理 IPv6 流量
allow-lan: true             # 允许局域网内的其他设备连接到这些端口使用代理
unified-delay: true         # 统一延迟计算方式
tcp-concurrent: true        # 开启 TCP 并发，提升连接建立速度
log-level: silent           # 日志级别，此处设置为静默，不输出日志以节省资源
bind-address: '*'           # 绑定所有网络接口
find-process-mode: 'always' # 始终开启进程匹配，用于识别具体是哪个软件发出的请求
keep-alive-interval: 15     # TCP 保活间隔时间
keep-alive-idle: 600        # TCP 保活空闲时间
authentication: [sinspired:sinspired] # 开启局域网连接身份验证，格式为 账号:密码
skip-auth-prefixes: [127.0.0.1/8, '::1/128'] # 本机访问豁免身份验证
experimental: {quic-go-disable-gso: true} # 禁用 QUIC 的 GSO 特性，解决部分设备的兼容性问题
 
# >>> 控制面板设置 <<<
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip # 面板下载地址
external-ui-name: zashboard # 面板名称
external-ui: ui             # 面板存放目录
external-controller: 0.0.0.0:9090 # #daier 本地及局域网均可通过 9090 端口访问控制面板
secret: sinspired           # 访问控制面板的鉴权密钥
profile: {store-selected: true, store-fake-ip: true} # 记忆用户的节点选择和缓存虚拟IP

# >>> 流量嗅探设置 <<<
sniffer:
  enable: true              # 开启嗅探
  sniff:
  # 强制解析 HTTP/TLS/QUIC 流量中的真实域名
    HTTP:  {ports: [80, 8080-8880], override-destination: true}
    TLS:   {ports: [443, 8443]}
    QUIC:  {ports: [443, 8443]}
  skip-domain: ["Mijia Cloud", "+.push.apple.com"]   # 跳过特定域名的嗅探以防断连

# >>> TUN虚拟网卡设置 <<<
tun:
  enable: false             # 此处设置为关闭状态。开启后可接管电脑全部流量
  stack: mixed              # 协议栈设定为混合模式
  dns-hijack: ["any:53", "tcp://any:53"] # 劫持所有发往 53 端口的 DNS 请求
  auto-route: true          # 自动配置路由表
  auto-redirect: true       # 自动重定向流量
  auto-detect-interface: true # 自动探测网络接口

# >>> DNS设置 <<<
dns:
  enable: true              # 开启内置 DNS 解析
  ipv6: false               # 关闭 IPv6 的 DNS 解析 (只返回 IPv4 地址)
  enhanced-mode: fake-ip    # 开启 Fake-IP 模式，加快网页响应速度并解决 DNS 污染
  fake-ip-range: 198.18.0.1/16 # 分配给 Fake-IP 的虚拟 IP 地址段
  default-nameserver: [119.29.29.29, 180.184.1.1, 223.5.5.5] # 基础域名解析服务器
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query] # 加密的 DNS 解析服务器
  fake-ip-filter: ["+.lan", "*.local", "+.gstatic.com", "+.miwifi.com", "+.market.xiaomi.com", "+.push.apple.com"] # 这些域名不使用虚拟IP，直接返回真实IP


